[project]
name = "ai-native-bi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abushuev08", email = "sashsergbush@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dataclasses>=0.8",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.0",
    "typing>=3.10.0.0",
]

[project.scripts]
ai-native-bi = "ai_native_bi:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
